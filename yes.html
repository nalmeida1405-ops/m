<!-- yes.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YES 💘</title>
  <style>
    :root{
      --bg1:#120018; --bg2:#2a0036;
      --card:#ffffff14; --border:#ffffff24;
      --text:#fff; --muted:#ffffffb3;
      --accent:#ff4da6; --accent2:#ff7ac1;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #ff4da624 0%, transparent 55%),
                  radial-gradient(1100px 700px at 80% 20%, #7c4dff1f 0%, transparent 60%),
                  linear-gradient(160deg,var(--bg1),var(--bg2));
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }
    .card{
      width:min(920px, 100%);
      background: linear-gradient(180deg, var(--card), transparent);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
      display:grid;
      grid-template-columns: 1fr 1fr;
      min-height:520px;
    }
    @media (max-width: 840px){
      .card{grid-template-columns:1fr}
    }
    .left{
      padding:22px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:12px;
    }
    h1{margin:0; font-size: clamp(30px, 3.6vw, 46px); line-height:1.08}
    p{margin:0; color:var(--muted); font-size: clamp(15px, 1.35vw, 17px); line-height:1.6}
    .btnRow{margin-top:10px; display:flex; gap:10px; flex-wrap:wrap}
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:#ffffff18;
      color:var(--text);
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:700;
      transition:.15s ease;
      user-select:none;
    }
    .btn:hover{background:#ffffff24}
    .btn.primary{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color:#ffffff55;
      box-shadow: 0 10px 25px rgba(255,77,166,.22);
    }
    .right{
      border-left:1px solid #ffffff18;
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    @media (max-width: 840px){
      .right{border-left:none; border-top:1px solid #ffffff18}
    }
    .frame{
      width:100%;
      height:100%;
      min-height:340px;
      border-radius:18px;
      border:1px solid #ffffff24;
      overflow:hidden;
      background:#00000020;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      position:relative;
    }
    img{width:100%; height:100%; object-fit:cover; display:block}
    .cap{
      position:absolute; left:14px; right:14px; bottom:14px;
      padding:10px 12px;
      border-radius:14px;
      background: #00000055;
      border:1px solid #ffffff20;
      backdrop-filter: blur(8px);
      font-weight:600;
      font-size:14px;
      color:#ffffffdf;
    }
    .audioCtl{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:6px;
    }
    .small{font-size:12px; color:#ffffffa6}
  </style>
</head>
<body>
  <div class="card">
    <div class="left">
      <h1>YESSS 💘</h1>
      <p>sorry it took so long to ask but I wanted to make it special</p>
      <p>Happy Valentine’s Day, Madison 💗</p>

      <div class="audioCtl">
        <button class="btn primary" id="musicBtn" type="button">Play music</button>
        <span class="small" id="hint">Click required to start audio.</span>
      </div>

      <div class="btnRow">
        <button class="btn" type="button" onclick="window.location.href='index.html'">Back to slides</button>
      </div>
    </div>

    <div class="right">
      <div class="frame">
        <img src="assets/photos/IMG_2327.jpg" alt="Nathan and Madison" />
        <div class="cap">💗</div>
      </div>
    </div>
  </div>

  <audio id="bgAudio" preload="auto" loop>
    <source src="assets/audio/spin-you-around.mp3" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("bgAudio");
    const btn = document.getElementById("musicBtn");
    const hint = document.getElementById("hint");

    async function toggleMusic(){
      try{
        if (audio.paused){
          await audio.play();
          btn.textContent = "Pause music";
          hint.textContent = "Playing 🎵";
        } else {
          audio.pause();
          btn.textContent = "Play music";
          hint.textContent = "Paused";
        }
      } catch(e){
        hint.textContent = "If it didn’t start: click Play again (browser blocks autoplay).";
      }
    }
    btn.addEventListener("click", toggleMusic);

    // Try on first interaction anywhere
    window.addEventListener("pointerdown", () => {
      if (audio.paused){
        audio.play().then(()=> {
          btn.textContent = "Pause music";
          hint.textContent = "Playing 🎵";
        }).catch(()=>{});
      }
    }, {once:true});
  </script>
</body>
</html>
