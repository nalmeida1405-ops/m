<!-- yes.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YES 💞</title>
  <style>
    :root{ --accent:#ff2d55; --ink:#2a1d21; --shadow: 0 18px 60px rgba(0,0,0,.18); }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink);
      display:grid;place-items:center;
      background: radial-gradient(900px 700px at 20% 10%, #ffd1dc, transparent 60%),
                radial-gradient(900px 700px at 80% 30%, #ffb6c1, transparent 55%),
                linear-gradient(160deg, #fff 0%, #ffe6ee 45%, #fff 100%);
      overflow:hidden;
    }
    .card{
      width:min(860px, 92vw);
      background: rgba(255,255,255,.9);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.06);
    }
    h1{margin:0 0 10px;font-size: clamp(34px, 4vw, 56px);letter-spacing:-0.02em;line-height:1.05;}
    p{margin:0 0 14px;font-size: 18px;line-height:1.5;opacity:.95;}
    .row{display:grid;grid-template-columns: 1.1fr .9fr;gap: 18px;align-items:center;}
    .photo{
      width:100%;border-radius: 18px;height: 320px;object-fit: cover;
      box-shadow: 0 18px 45px rgba(0,0,0,.16);
      border: 1px solid rgba(0,0,0,.06);background:#f3f3f3;
    }
    .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top: 10px;}
    a{
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;
      padding: 12px 18px;border-radius: 999px;font-weight: 800;
      background: var(--accent);color:#fff;box-shadow: 0 16px 30px rgba(255,45,85,.28);
    }
    .ghost{background: rgba(255,45,85,.10);color: var(--ink);border: 1px solid rgba(255,45,85,.25);box-shadow:none;}
    @media (max-width: 860px){ .row{grid-template-columns: 1fr;} .photo{height: 260px;} }
    .heart{position:fixed;top:-20px;font-size: 18px;animation: fall linear forwards;opacity:.9;pointer-events:none;}
    @keyframes fall{ to{ transform: translateY(110vh) rotate(260deg); opacity:.2; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div>
        <h1>YES!!! 💞</h1>
        <p>Ok perfect. Valentine secured. ✅</p>
        <p>sorry it took so long to ask but I wanted to make it special</p>
        <div class="btns">
          <a href="index.html" class="ghost">← Back</a>
          <a href="#" id="moreHearts">More hearts 💗</a>
        </div>
        <p style="margin-top:12px; opacity:.7; font-size:14px;">— Nathan</p>
      </div>
      <div>
        <img class="photo" src="assets/photos/IMG_4244.jpeg" alt="Us">
      </div>
    </div>
  </div>

  <script>
    function dropHearts(n=18){
      const chars = ["💗","💘","💞","💕","❤️"];
      for(let i=0;i<n;i++){
        const el = document.createElement('div');
        el.className = 'heart';
        el.textContent = chars[Math.floor(Math.random()*chars.length)];
        el.style.left = Math.random()*100 + 'vw';
        el.style.animationDuration = (2.8 + Math.random()*2.6) + 's';
        el.style.fontSize = (14 + Math.random()*18) + 'px';
        el.style.filter = 'drop-shadow(0 10px 12px rgba(0,0,0,.15))';
        document.body.appendChild(el);
        setTimeout(()=> el.remove(), 6000);
      }
    }
    dropHearts(22);
    document.getElementById('moreHearts').addEventListener('click', (e) => {
      e.preventDefault();
      dropHearts(28);
    });
  </script>
</body>
</html>
