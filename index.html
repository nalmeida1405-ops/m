<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Madison 💘</title>
  <style>
    :root{
      --bg1:#120018; --bg2:#2a0036;
      --card:#ffffff14; --border:#ffffff24;
      --text:#fff; --muted:#ffffffb3;
      --accent:#ff4da6; --accent2:#ff7ac1;
      --btn:#ffffff20; --btn2:#ffffff2e;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #ff4da624 0%, transparent 55%),
                  radial-gradient(1100px 700px at 80% 20%, #7c4dff1f 0%, transparent 60%),
                  linear-gradient(160deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    /* floating hearts */
    .hearts{position:fixed; inset:0; pointer-events:none; opacity:.55}
    .heart{
      position:absolute; font-size:22px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
      animation: floatUp linear infinite;
    }
    @keyframes floatUp{
      from{transform:translateY(110vh) translateX(0) rotate(0deg); opacity:0}
      10%{opacity:.9}
      to{transform:translateY(-15vh) translateX(40px) rotate(18deg); opacity:0}
    }

    .wrap{
      position:relative;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .card{
      width:min(980px, 100%);
      height:min(620px, 86vh);
      background: linear-gradient(180deg, var(--card), transparent);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.05fr .95fr;
    }
    @media (max-width: 840px){
      .card{grid-template-columns:1fr; height:auto; max-height:86vh}
    }

    .left{
      padding:22px 22px 18px 22px;
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height:420px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .namepill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      background: #ffffff12;
      font-weight:600;
      letter-spacing:.2px;
    }

    .audioCtl{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
    }
    .smallBtn{
      appearance:none;
      border:1px solid var(--border);
      background: #ffffff14;
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
      font-weight:600;
      transition:.15s ease;
      user-select:none;
    }
    .smallBtn:hover{background:#ffffff1f}
    .smallBtn:active{transform:translateY(1px)}
    .hint{font-size:12px; color:var(--muted); max-width:210px; text-align:right}

    .content{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:12px;
      padding:6px 2px 0 2px;
    }
    h1{
      margin:0;
      font-size: clamp(26px, 3.2vw, 40px);
      line-height:1.12;
    }
    p{
      margin:0;
      font-size: clamp(15px, 1.35vw, 17px);
      color:var(--muted);
      line-height:1.55;
    }

    .bullets{
      margin:8px 0 0 0;
      padding:0 0 0 18px;
      color:var(--muted);
      line-height:1.6;
      font-size: clamp(14px, 1.35vw, 17px);
    }
    .bullets li{margin:6px 0}

    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding-top:6px;
      border-top:1px solid #ffffff18;
    }
    .progress{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#ffffff10;
      transition:.2s ease;
    }
    .dot.active{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color:#ffffff40;
      transform:scale(1.15);
    }

    .btnRow{display:flex; gap:10px; align-items:center; justify-content:flex-end}
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background: var(--btn);
      color:var(--text);
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:700;
      transition:.15s ease;
      user-select:none;
      min-width:110px;
    }
    .btn:hover{background:var(--btn2)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color:#ffffff55;
      box-shadow: 0 10px 25px rgba(255,77,166,.22);
    }

    .right{
      position:relative;
      border-left:1px solid #ffffff18;
      background:#00000010;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    @media (max-width: 840px){
      .right{border-left:none; border-top:1px solid #ffffff18; padding:14px}
    }
    .photoFrame{
      width:100%;
      height:100%;
      min-height:340px;
      border-radius:18px;
      border:1px solid #ffffff24;
      background:#00000020;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      position:relative;
    }
    img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform: scale(1.01);
    }
    .caption{
      position:absolute;
      left:14px; right:14px; bottom:14px;
      padding:10px 12px;
      border-radius:14px;
      background: #00000055;
      border:1px solid #ffffff20;
      backdrop-filter: blur(8px);
      font-weight:600;
      font-size:14px;
      color:#ffffffdf;
    }

    /* final slide buttons */
    .yn{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .btn.no{
      background:#ffffff12;
      position:relative;
    }

    /* tiny footer note */
    .kbd{font-size:12px; color:#ffffffa6}
    .kbd span{border:1px solid #ffffff24; padding:2px 6px; border-radius:8px; background:#ffffff0e}
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="wrap">
    <div class="card" role="region" aria-label="Valentine slideshow">
      <div class="left">
        <div class="topbar">
          <div class="namepill">Madison <span aria-hidden="true">💗</span></div>

          <div class="audioCtl">
            <button class="smallBtn" id="musicBtn" type="button">Play music</button>
          </div>
        </div>
        <div class="hint" id="musicHint">Music on sites usually needs a click to start.</div>

        <div class="content" id="textArea"></div>

        <div class="nav">
          <div class="progress" aria-label="Slide progress">
            <div class="dot" id="d0"></div>
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
          </div>

          <div class="btnRow">
            <button class="btn" id="prevBtn" type="button">Back</button>
            <button class="btn primary" id="nextBtn" type="button">Next</button>
          </div>
        </div>
        <div class="kbd">Tip: use <span>←</span> <span>→</span> keys</div>
      </div>

      <div class="right">
        <div class="photoFrame" aria-label="Photo">
          <img id="photo" alt="Photo of Nathan and Madison" />
          <div class="caption" id="caption"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="bgAudio" preload="auto" loop>
    <source src="assets/audio/spin-you-around.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ✅ Update these filenames to EXACTLY match what you uploaded in assets/photos/
    const slides = [
      {
        title: "Hi my love",
        body: "you are the most special person in my life and I am so happy I am able to call you mine. I made a little something here to remind you how special you are to me. Click through the slides",
        photo: "assets/photos/IMG_4244.jpeg",
        caption: "Slide 1/3"
      },
      {
        title: "Things I love about you",
        bullets: [
          "how safe you make me feel",
          "how beautiful you are",
          "how your smile lights up a room",
          "how you make my bad days good and my good days amazing",
          "how funny you are (im funnier relax)"
        ],
        photo: "assets/photos/IMG_6474.jpeg",
        caption: "Slide 2/3"
      },
      {
        title: "Madison… will you be my Valentine? 💘",
        body: "No pressure (but also… yes pressure).",
        photo: "assets/photos/IMG_2327.jpg", // Christmas tree photo last
        caption: "Final slide",
        isFinal: true
      }
    ];

    const elText = document.getElementById("textArea");
    const elPhoto = document.getElementById("photo");
    const elCaption = document.getElementById("caption");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dots = [document.getElementById("d0"), document.getElementById("d1"), document.getElementById("d2")];

    const audio = document.getElementById("bgAudio");
    const musicBtn = document.getElementById("musicBtn");
    const musicHint = document.getElementById("musicHint");

    let idx = 0;
    let noMoved = false;

    function render(){
      const s = slides[idx];

      // dots
      dots.forEach((d, i) => d.classList.toggle("active", i === idx));

      // photo + caption
      elPhoto.src = s.photo;
      elCaption.textContent = s.caption || "";

      // text
      elText.innerHTML = "";

      const h1 = document.createElement("h1");
      h1.textContent = s.title;
      elText.appendChild(h1);

      if (s.bullets && s.bullets.length){
        const ul = document.createElement("ul");
        ul.className = "bullets";
        s.bullets.forEach(t => {
          const li = document.createElement("li");
          li.textContent = t;
          ul.appendChild(li);
        });
        elText.appendChild(ul);
      } else if (s.body){
        const p = document.createElement("p");
        p.textContent = s.body;
        elText.appendChild(p);
      }

      // nav buttons
      prevBtn.disabled = (idx === 0);
      prevBtn.style.opacity = prevBtn.disabled ? 0.6 : 1;

      if (!s.isFinal){
        nextBtn.textContent = "Next";
        nextBtn.onclick = () => { idx = Math.min(idx + 1, slides.length - 1); render(); };
      } else {
        nextBtn.textContent = "Reset";
        nextBtn.onclick = () => { idx = 0; render(); };
        // Yes/No buttons
        const row = document.createElement("div");
        row.className = "yn";

        const yes = document.createElement("button");
        yes.className = "btn primary";
        yes.type = "button";
        yes.textContent = "Yes 💘";
        yes.onclick = () => { window.location.href = "yes.html"; };

        const no = document.createElement("button");
        no.className = "btn no";
        no.type = "button";
        no.textContent = "No 🙃";
        no.style.minWidth = "110px";
        no.onmouseenter = () => {
          // playful fake button: dodge once user tries
          if (noMoved) return;
          noMoved = true;
          no.style.position = "relative";
          const dx = Math.floor(Math.random() * 140) - 70;
          const dy = Math.floor(Math.random() * 60) - 30;
          no.style.transform = `translate(${dx}px, ${dy}px)`;
          setTimeout(() => { no.style.transform = "translate(0,0)"; noMoved = false; }, 600);
        };
        no.onclick = (e) => { e.preventDefault(); };

        row.appendChild(yes);
        row.appendChild(no);
        elText.appendChild(row);
      }
    }

    prevBtn.onclick = () => { idx = Math.max(idx - 1, 0); render(); };

    // keyboard nav
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && idx < slides.length - 1){ idx++; render(); }
      if (e.key === "ArrowLeft" && idx > 0){ idx--; render(); }
    });

    // Hearts
    const hearts = document.getElementById("hearts");
    const heartChars = ["💗","💖","💘","💝","💕"];
    for (let i=0;i<18;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartChars[i % heartChars.length];
      h.style.left = Math.random()*100 + "vw";
      h.style.animationDuration = (8 + Math.random()*10) + "s";
      h.style.animationDelay = (-Math.random()*10) + "s";
      h.style.fontSize = (18 + Math.random()*16) + "px";
      hearts.appendChild(h);
    }

    // Audio: user gesture required on most browsers
    async function toggleMusic(){
      try{
        if (audio.paused){
          await audio.play();
          musicBtn.textContent = "Pause music";
          musicHint.textContent = "Playing 🎵";
        } else {
          audio.pause();
          musicBtn.textContent = "Play music";
          musicHint.textContent = "Paused";
        }
      } catch (err){
        musicHint.textContent = "If it didn’t start: click Play again (browser blocks autoplay).";
      }
    }
    musicBtn.addEventListener("click", toggleMusic);

    // Optional: attempt gentle autoplay after first interaction anywhere
    function firstTapStart(){
      if (audio.paused){
        audio.play().then(() => {
          musicBtn.textContent = "Pause music";
          musicHint.textContent = "Playing 🎵";
        }).catch(()=>{});
      }
      window.removeEventListener("pointerdown", firstTapStart);
    }
    window.addEventListener("pointerdown", firstTapStart, {once:true});

    render();
  </script>
</body>
</html>
